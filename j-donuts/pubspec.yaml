name: jdonuts
description: J'Donuts customer app with offline-first data, a motion system and fake authentication.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.3"

dependencies:
  animations: ^3.0.0
  bloc: ^9.2.1
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: 2.34.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.5.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.2
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  logger: ^2.8.0
  meta: ^1.18.0
dev_dependencies:
  analyzer: ^10.2.0
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/onboarding/
    - assets/images/home/
    - assets/images/welcome/
    - assets/images/rewards/
    - assets/seed/
    - assets/seed/images/

  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
